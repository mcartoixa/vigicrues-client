name: test-live

on:
  schedule:
  - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-live:
    runs-on: ubuntu-24.04
    env:
      UV_MANAGED_PYTHON: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: '0.13.9'
    - name: Prepare environment
      run: uv sync --upgrade
    - name: Test
      run: uv run --no-sync invoke verbose test-live
    - name: Archive logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: logs
        path: |
          build.log
        retention-days: 5
