name: build

on:
  push:
    paths-ignore:
    - '.idea/**'
    - '.vscode/**'
    - '.editorconfig'
    - '**.md'
    - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_MANAGED_PYTHON: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: '0.13.9'
        cache-suffix: ${{ matrix.python-version }}
    - name: Prepare environment
      run: uv sync --upgrade
    - name: Build
      run: uv run --no-sync invoke verbose release
    - name: Upload coverage to Codecov
      if: ${{ matrix.python-version == '3.15' }}
      uses: codecov/codecov-action@v7
      with:
        directory: tmp/
        disable_search: true
        files: tmp/vigicrues-client-cobertura-results.xml
        flags: unittests
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Archive artifacts
      if: ${{ matrix.python-version == '3.15' }}
      uses: actions/upload-artifact@v7
      with:
        name: outputs
        path: |
          tmp/out/bin/**.*
    - name: Archive logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.python-version }}
        path: |
          build.log
        retention-days: 5
