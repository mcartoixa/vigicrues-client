name: build

on:
  push:
    paths-ignore:
    - '.idea/**'
    - '.vscode/**'
    - '.editorconfig'
    - '**.md'
    - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        resolution: ['highest']
        include:
        - python-version: '3.11'
          resolution: 'lowest-direct'
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_MANAGED_PYTHON: true
      UV_RESOLUTION: ${{ matrix.resolution }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: '0.13.9'
        cache-suffix: ${{ matrix.python-version }}-${{ matrix.resolution }}
    - name: Check version against tag
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run: |
        version="$(uv version --short)"
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
          exit 1
        fi
    - name: Prepare environment
      run: uv sync --upgrade
    - name: Build
      run: uv run --no-sync invoke verbose release
    - name: Upload coverage to Codecov
      if: ${{ matrix.python-version == '3.15' }}
      uses: codecov/codecov-action@v7
      with:
        directory: tmp/
        disable_search: true
        files: tmp/vigicrues-client-cobertura-results.xml
        flags: unittests
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Archive artifacts
      if: ${{ matrix.python-version == '3.15' }}
      uses: actions/upload-artifact@v7
      with:
        name: outputs
        path: |
          tmp/out/bin/**.*
    - name: Archive logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.python-version }}-${{ matrix.resolution }}
        path: |
          build.log
        retention-days: 5

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    # Trusted Publishing: the index accepts uploads from this workflow and environment, with the
    # identity token that only this job may request
    environment:
      name: pypi
      url: https://pypi.org/p/vigicrues-client
    permissions:
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: outputs
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
